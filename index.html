<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>28–0</title>
<meta name="description" content="Draft a lineup from Overwatch League and OWCS history, one team and era at a time, and try to go 28–0. A fan-made game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Saira+Condensed:wght@700;800;900&display=swap">
<style>
/* Hero-select desk: a bright sky backdrop with angled light streaks, navy glass panels on top.
   Skewed parallelogram controls, oblique condensed uppercase headings, one orange action colour,
   blue for your side and red for losses. Team bar across the top, draft stage below. */
:root{
  --sky-1:#3f97f2; --sky-2:#8fcaff; --sky-3:#e6f3ff; --streak:rgba(255,255,255,.22);
  --on-sky:#0b1a33; --on-sky-2:#23436e;
  --glass:rgba(13,21,40,.88); --glass-2:rgba(27,39,66,.92); --glass-3:rgba(255,255,255,.06);
  --edge:rgba(255,255,255,.16); --edge-2:rgba(255,255,255,.34);
  --ink:#ffffff; --ink-2:#bcc7dc; --ink-3:#8593ad;
  --orange:#f99e1a; --orange-hi:#ffb547; --orange-ink:#241300;
  --blue:#46c2ff; --red:#ff5160; --gold:#ffcf5c;
  --tank:#6db8ff; --dps:#ff8a73; --sup:#72e5ab;
  --f-head:"Saira Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --f-body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --skew:-12deg;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-1:#071430; --sky-2:#0f2a55; --sky-3:#1b4579; --streak:rgba(255,255,255,.05);
  --on-sky:#eef4ff; --on-sky-2:#a9c0e4; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-1:#071430; --sky-2:#0f2a55; --sky-3:#1b4579; --streak:rgba(255,255,255,.05);
  --on-sky:#eef4ff; --on-sky-2:#a9c0e4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--sky-1)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:
    repeating-linear-gradient(112deg,transparent 0 150px,var(--streak) 150px 153px,transparent 153px 310px),
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 42%,var(--sky-3) 100%);
  background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:18px}
.r-T{color:var(--tank)} .r-D{color:var(--dps)} .r-S{color:var(--sup)}
svg{display:block}

/* ---------- skew primitive: the shape lives on ::before, content stays upright ---------- */
.sk{position:relative;isolation:isolate}
.sk::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(var(--skew));
  background:var(--glass);border:1px solid var(--edge);transition:background .12s,border-color .12s,box-shadow .12s}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px}
.brand{min-width:0}
.mark{margin:0;font:italic 900 clamp(64px,10vw,116px)/.82 var(--f-head);letter-spacing:-.01em;color:var(--on-sky);
  text-shadow:0 2px 0 rgba(255,255,255,.25)}
.mark span{color:var(--orange);margin:0 .03em}
.tag{margin:10px 0 0;max-width:56ch;color:var(--on-sky-2);font-size:15px;text-wrap:pretty}
.tag b{color:var(--on-sky);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-left:8px}
.tabs{display:flex;gap:6px}
.tab{border:0;background:transparent;cursor:pointer;padding:9px 18px;
  font:italic 800 17px/1 var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tab:hover::before{border-color:var(--edge-2)}
.tab[aria-pressed="true"]{color:var(--orange-ink)}
.tab[aria-pressed="true"]::before{background:var(--orange);border-color:var(--orange-hi)}
.chk{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;padding:9px 16px;
  font:italic 800 16px/1 var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.chk input{appearance:none;width:15px;height:15px;margin:0;border:2px solid var(--ink-2);transform:skewX(var(--skew));cursor:pointer}
.chk input:checked{background:var(--orange);border-color:var(--orange)}
.chk:has(input:checked){color:var(--ink)}

/* ---------- team bar (lineup) ---------- */
.teambar{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:14px 18px 12px;display:grid;gap:12px}
.bar-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.bar-title{margin:0;font:italic 900 28px/1 var(--f-head);text-transform:uppercase;letter-spacing:.02em}
.bar-meta{font:italic 700 15px/1 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.bar-rating{margin-left:auto;display:flex;align-items:baseline;gap:8px;font:italic 700 15px/1 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.bar-rating b{font:italic 900 34px/1 var(--f-head);color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.bar-rating small{font:500 12.5px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--blue)}
.plates{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;padding:0 6px}
@media (max-width:900px){.plates{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"badge slot ovr" "badge name ovr" "badge from ovr";
  column-gap:10px;align-items:center;padding:9px 16px 9px 14px;min-height:72px}
.plate::before{background:var(--glass-2)}
.plate.empty::before{background:transparent;border-style:dashed;border-color:var(--edge-2)}
.plate.filled::before{border-color:var(--edge-2)}
.plate.mvp::before{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 18px rgba(255,207,92,.25)}
.badge{grid-area:badge;width:36px;height:36px;display:grid;place-items:center;background:rgba(255,255,255,.07);
  transform:rotate(45deg);border:1px solid var(--edge)}
.badge svg{width:17px;height:17px;transform:rotate(-45deg)}
.pl-slot{grid-area:slot;font:italic 700 12.5px/1.1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pl-slot em{font-style:inherit;color:var(--gold)}
.pl-name{grid-area:name;font:italic 800 22px/1.05 var(--f-head);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.empty .pl-name{color:var(--ink-3);font-weight:700}
.pl-from{grid-area:from;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ovr{grid-area:ovr;font:italic 900 30px/1 var(--f-head);font-variant-numeric:tabular-nums}
.pl-ovr.hid{color:var(--ink-3);font-size:22px}
.hint{margin:0;font-size:12.5px;color:var(--ink-3)}
@media (max-width:560px){
  .plates{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 4px}
  .plates[style*="--n:5"] .plate:first-child{grid-column:1/-1}
  .plate{min-height:58px;padding:7px 14px 7px 14px;column-gap:6px;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"slot ovr" "name name" "from from"}
  .badge{display:none}
  .pl-slot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-name{font-size:19px}.pl-ovr{font-size:20px;align-self:start}.pl-ovr.hid{font-size:16px}.pl-from{font-size:11.5px}
}

/* ---------- stage ---------- */
.stage{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:20px 22px 22px;display:grid;gap:18px;min-height:420px;align-content:start}
.tagchip{display:inline-block;padding:5px 13px;font:italic 800 13.5px/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.tagchip::before{background:var(--glass-3)}
.tagchip.gold{color:#2b1d00}.tagchip.gold::before{background:var(--gold);border-color:var(--gold)}
.progress{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.step{font:italic 700 15px/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.step b{font-size:22px;color:var(--ink)}
.pips{display:flex;gap:5px;padding-right:4px}
.pip{width:30px;height:8px;transform:skewX(var(--skew));background:rgba(255,255,255,.14)}
.pip.on{background:var(--orange)}

/* intro */
.intro{display:grid;gap:16px;justify-items:start}
.intro-title{margin:0;font:italic 900 clamp(38px,5.6vw,64px)/.92 var(--f-head);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;max-width:16ch}
.intro-title em{font-style:inherit;color:var(--orange)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:66ch}
.rules li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;color:var(--ink-2)}
.rules b{color:var(--ink);font-weight:600}
.rules .n{display:grid;place-items:center;height:28px;font:italic 900 18px/1 var(--f-head);color:var(--orange-ink)}
.rules .n::before{background:var(--orange);border-color:var(--orange-hi)}

/* team banner: team colour with an angled split, like a map-load card */
.banner{position:relative;overflow:hidden;color:var(--team-ink);padding:16px 22px 14px;
  background:linear-gradient(104deg,var(--team) 0 64%,color-mix(in srgb,var(--team) 62%,#000) 64% 100%)}
.banner::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(104deg,transparent 0 22px,rgba(255,255,255,.07) 22px 24px);mix-blend-mode:soft-light}
.banner-top{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.banner .tagchip{color:var(--team-ink)}
.banner .tagchip::before{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.28)}
.banner .tagchip.gold{color:#2b1d00}.banner .tagchip.gold::before{background:var(--gold);border-color:var(--gold)}
.banner-title{position:relative;z-index:1;margin:10px 0 10px;font:italic 900 clamp(34px,5.4vw,60px)/.9 var(--f-head);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.banner-title .yr{display:block;font-size:.5em;letter-spacing:.06em;opacity:.85;margin-bottom:4px}
.banner.rolling .banner-title{opacity:.75}
.eras{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;min-height:26px;padding-left:4px}
.era{padding:5px 12px;font:italic 800 14px/1 var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--team-ink);opacity:.75}
.era::before{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.3)}
.era.on{opacity:1;color:#0b1424}.era.on::before{background:#fff;border-color:#fff}
.era.used{opacity:.4;text-decoration:line-through}
.facts{display:grid;gap:6px}
.srecs{display:flex;flex-wrap:wrap;gap:4px 18px;font:italic 700 15px/1.3 var(--f-head);letter-spacing:.06em;color:var(--ink-3)}
.srecs b{color:var(--ink);font-weight:800}
.srecs .champ{color:var(--gold)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:2px;color:var(--ink-2);font-size:13.5px}
.notes b{color:var(--ink);font-weight:600;margin-right:6px}

/* roster: hero-select tiles grouped by role */
.roster{display:grid;gap:14px}
.rhead{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:italic 800 16px/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase}
.rhead svg{width:16px;height:16px}
.rhead span{color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px 12px;padding:0 8px}
.tile{border:0;background:transparent;cursor:pointer;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"name ovr" "sub ovr";column-gap:8px;padding:10px 16px 10px 18px;color:var(--ink);transition:transform .12s}
.tile::before{background:var(--glass-2)}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:hover:not(:disabled)::before{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange),0 6px 18px rgba(249,158,26,.18)}
.tile:disabled{cursor:not-allowed;opacity:.38}
.t-name{grid-area:name;font:italic 800 20px/1.05 var(--f-head);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{grid-area:sub;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ovr{grid-area:ovr;align-self:center;font:italic 900 26px/1 var(--f-head);font-variant-numeric:tabular-nums}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-left:6px}
.btn{border:0;background:transparent;cursor:pointer;padding:13px 28px;font:italic 900 19px/1 var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.btn::before{background:var(--glass-2);border-color:var(--edge-2)}
.btn:hover:not(:disabled)::before{border-color:var(--ink)}
.btn.primary{color:var(--orange-ink)}
.btn.primary::before{background:var(--orange);border-color:var(--orange-hi);box-shadow:0 6px 20px rgba(249,158,26,.3)}
.btn.primary:hover::before{background:var(--orange-hi)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.note-sm{font-size:13px;color:var(--ink-3)}
.copied{font:italic 800 15px/1 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.share-fallback{width:100%;min-height:120px;background:var(--glass-2);color:var(--ink);border:1px solid var(--edge);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px}

/* results: post-match */
.post{position:relative;overflow:hidden;padding:18px 22px 20px;display:grid;gap:6px;
  background:linear-gradient(104deg,var(--res) 0 58%,color-mix(in srgb,var(--res) 55%,#000) 58% 100%);color:#0b1424}
.post.blue{--res:var(--blue)} .post.gold{--res:var(--gold)} .post.red{--res:var(--red);color:#fff}
.post .tagchip{color:inherit}.post .tagchip::before{background:rgba(0,0,0,.14);border-color:rgba(0,0,0,.18)}
.post-verdict{font:italic 900 clamp(46px,8vw,96px)/.85 var(--f-head);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.post-rec{font:italic 900 clamp(40px,6vw,64px)/1 var(--f-head);font-variant-numeric:tabular-nums;display:flex;gap:.15em}
.post-rec .d{opacity:.55}
.post-sub{margin:0;font-size:14px;max-width:70ch;opacity:.85}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;padding:0 6px}
@media (max-width:560px){.strip{grid-template-columns:repeat(7,minmax(0,1fr))}}
.g{height:20px;transform:skewX(var(--skew));background:var(--blue)}
.g.L{background:var(--red)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--glass-2);border:1px solid var(--edge);padding:14px 16px;min-width:0}
.box.wide{grid-column:1/-1}
.box h4{margin:0 0 10px;font:italic 800 16px/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:14px}
.rows .k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .k small{color:var(--ink-3)}
.rows .v{font:italic 800 17px/1 var(--f-head);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.won{color:var(--blue)} .lost{color:var(--red)} .gold-t{color:var(--gold)}

.foot{margin:4px 0 0;color:var(--on-sky-2);font-size:12.5px}
.foot .credits{font-size:11.5px;opacity:.8}
.top{align-items:center}
.top .mark{font-size:clamp(54px,8vw,92px)}
/* main menu: big stacked selections */
.menu{display:grid;gap:16px;justify-items:start;padding:8px 8px 6px}
.play{border:0;background:transparent;cursor:pointer;display:grid;gap:6px;justify-items:start;text-align:left;padding:18px 54px 16px 38px;color:var(--orange-ink);margin-bottom:6px}
.play::before{background:var(--orange);border-color:var(--orange-hi);box-shadow:0 10px 30px rgba(249,158,26,.35)}
.play:hover::before{background:var(--orange-hi)}
.play span{font:italic 900 clamp(52px,8vw,84px)/.85 var(--f-head);text-transform:uppercase;letter-spacing:.01em}
.play small{font:italic 800 16px/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.mlabel{width:118px;font:italic 800 17px/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mopt{border:0;background:transparent;cursor:pointer;min-width:180px;padding:17px 28px;font:italic 900 28px/1 var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.mopt::before{background:var(--glass-2);border-color:var(--edge)}
.mopt:hover::before{border-color:var(--edge-2)}
.mopt.on{color:var(--orange-ink)}.mopt.on::before{background:var(--orange);border-color:var(--orange-hi)}
@media (max-width:560px){.mlabel{width:100%}.mopt{min-width:0;flex:1;font-size:22px;padding:15px 14px}.play{padding:16px 40px 14px 28px}}
/* logos */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:20px;align-items:center}
.banner>*:not(.banner-logo){grid-column:2}
.banner-logo{grid-column:1;grid-row:1/4;width:clamp(72px,11vw,116px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;padding:10px;position:relative;z-index:1}
.banner-logo::before{background:rgba(6,12,26,.55);border-color:rgba(255,255,255,.25)}
.banner-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.banner-logo:empty{display:none}
.mini{width:17px;height:17px;object-fit:contain;vertical-align:-3px;margin-right:6px}
.cols{align-items:start}
@media (max-width:560px){.banner{column-gap:12px}}
@keyframes pop{from{transform:translateY(8px);opacity:.2}to{transform:none;opacity:1}}
.pop{animation:pop .26s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="mark">28<span>–</span>0</h1>
    <button class="tab sk" id="menu-btn" type="button" hidden>Menu</button>
  </header>

  <section class="teambar" id="lineup" aria-label="Your lineup" hidden></section>
  <main class="stage" id="stage" aria-live="polite"></main>

  <p class="foot">Not affiliated with Blizzard Entertainment.<br><span class="credits">Rosters and team logos via Liquipedia · stats from the OWL Stats Lab, OWTV and owtics · logos belong to their teams.</span></p>
</div>

<script>
/* ================= DATA =================
   [league, year, abbr, team, record, note, champion?, [[handle, role, rating, sub-role], ...]]
   Roles: T tank, D damage, S support. Ratings are per-season (60–99).
   Rosters: Liquipedia team cards. OWL 2018–2022 ratings: Stats Lab per-10 stats by role,
   team record, share of minutes played and awards. 2023: neighbouring seasons + results. OWCS 2025: OWTV per-map stats (Stage 3 + World Finals).
   OWCS 2024–25: owtics Player-of-the-Match awards and stage placements.
   2023–2025 are then calibrated so each year's starters average the same as OWL 2018–22
   (shift applies fully at 84 and below, fading to zero at 90+, so stars are unchanged).
   Playoff runs: champions' 7 highest-rated players +3, Grand Finals runners-up +1.5.   */

/* ================= RNG ================= */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function strength(s,six){
  const by=ro=>s.players.filter(p=>p.ro===ro).map(p=>p.ra).sort((a,b)=>b-a);
  const t=by('T'),d=by('D'),su=by('S');
  const v=[t[0]??FILL,d[0]??FILL,d[1]??FILL,su[0]??FILL,su[1]??FILL];
  if(six)v.push(t[1]??FILL);   // 6v6 teams field a second tank
  return v.reduce((a,b)=>a+b,0)/v.length;
}
// Opponents are pulled slightly toward the league middle: a hand-picked five of stars should be able to run the table.
const SHRINK={'5v5':0.92,'6v6':0.95};
for(const [f,six] of [['5v5',false],['6v6',true]]){
  const raw=SEASONS.map(s=>strength(s,six)).sort((a,b)=>a-b),MED=raw[raw.length>>1];
  SEASONS.forEach(s=>s['str'+f]=MED+(strength(s,six)-MED)*SHRINK[f]);}

const logistic=x=>1/(1+Math.exp(-x));
// One regular season = 28 matches, the length of the 2019 OWL season (the first with all 20 teams).
const GAMES=28, PLAYOFF_WINS=17;

function teamRating(lineup){
  const n=lineup.length,avg=lineup.reduce((a,p)=>a+p.ra,0)/n;
  let chem=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const a=lineup[i],b=lineup[j];
    if(a.sid===b.sid||(a.eid!=null&&a.eid===b.eid))chem+=0.6; else if(SEASONS[a.sid].org===SEASONS[b.sid].org)chem+=0.25;
  }
  chem=Math.min(chem,2.5);
  return {avg,chem,R:avg+chem};
}

function simulate(lineup){
  const {avg,chem,R}=teamRating(lineup);
  const key=lineup.map(p=>p.sid+':'+p.n).join('|');
  const rnd=rng32(hashStr(key));
  const opps=shuffle(SEASONS,rnd).slice(0,GAMES);
  const games=opps.map(s=>({s,p:logistic((R-s.str)/1.3)}));
  const exp=games.reduce((a,g)=>a+g.p,0);
  const losses=Math.floor(GAMES-exp+1e-9), wins=GAMES-losses;
  const order=games.map((g,i)=>i).sort((a,b)=>games[a].p-games[b].p);
  const lossSet=new Set(order.slice(0,losses));
  games.forEach((g,i)=>g.w=!lossSet.has(i));
  // playoffs
  let playoffs=null, champion=false;
  if(wins>=PLAYOFF_WINS){
    const ranked=SEASONS.slice().sort((a,b)=>b.str-a.str);
    const pickFrom=(lo,hi,used)=>{const pool=ranked.slice(lo,hi).filter(s=>!used.has(s.id));return pool[Math.floor(rnd()*pool.length)];};
    const used=new Set();
    const rounds=[['Quarterfinal',6,14,3],['Semifinal',2,6,3],['Grand Final',0,2,4]];
    playoffs=[];champion=true;
    for(const [name,lo,hi,need] of rounds){
      const opp=pickFrom(lo,hi,used);used.add(opp.id);
      const mp=logistic((R-opp.str)/2.2);let a=0,b=0;
      while(a<need&&b<need){if(rnd()<mp)a++;else b++;}
      playoffs.push({name,opp,a,b,won:a>b});
      if(b>a){champion=false;break;}
    }
  }
  return {avg,chem,R,games,wins,losses,playoffs,champion};
}

function bestFromPicks(picks){
  const pools=picks.map(p=>p.eid!=null?ERAS[p.eid].players.map(x=>({...x,eid:p.eid})):SEASONS[p.sid].players.map(x=>({...x,sid:p.sid})));
  let best=null,bestSum=-1;
  const perm=(arr,k=0)=>{
    if(k===arr.length){
      let sum=0;const lu=[];
      for(let i=0;i<N;i++){
        const c=pools[arr[i]].filter(p=>fitsSlot(p,i)&&!lu.some(q=>q.n.toLowerCase()===p.n.toLowerCase())).sort((a,b)=>b.ra-a.ra)[0];
        if(!c)return; sum+=c.ra; lu.push(c);
      }
      const tr=teamRating(lu).R;
      if(tr>bestSum){bestSum=tr;best=lu;}
      return;
    }
    for(let i=k;i<arr.length;i++){[arr[k],arr[i]]=[arr[i],arr[k]];perm(arr,k+1);[arr[k],arr[i]]=[arr[i],arr[k]];}
  };
  perm([...Array(N).keys()]);
  return best;
}

function verdict(w){
  if(w===GAMES)return 'Perfect season';
  if(w>=25)return 'Juggernaut';
  if(w>=21)return 'Title contender';
  if(w>=PLAYOFF_WINS)return 'Playoff team';
  if(w>=10)return 'Play-in hopeful';
  if(w>=1)return 'Rebuild year';
  return 'Shanghai ’18 tribute act';
}

// Roll a team (every franchise/org equally likely), then one of its eras.
// Eras already shown this draft, or with nobody who fits an open slot, are skipped.
function rollEra(){
  for(let tries=0;tries<600;tries++){
    const o=ORGS[Math.floor(S.rng()*ORGS.length)];
    const es=o.eras.filter(e=>!S.usedE.has(e.id));
    if(!es.length)continue;
    const e=es[Math.floor(S.rng()*es.length)];
    if(!fits(e)){S.usedE.add(e.id);continue;}
    return {o,e};
  }
  const e=ERAS.find(x=>!S.usedE.has(x.id)&&fits(x))||ERAS.find(fits);
  return {o:ORG_BY[e.org],e};
}

// Other eras of the current team that are still available (for the era reroll).
const altEras=()=>S.org&&S.current?S.org.eras.filter(x=>x.id!==S.current.id&&!S.usedE.has(x.id)&&fits(x)):[];

// keepTeam: reroll the era only, staying on the current team.
function deal(keepTeam){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let o,e;
  if(keepTeam){const alts=altEras();if(!alts.length)return;o=S.org;e=alts[Math.floor(S.rng()*alts.length)];}
  else ({o,e}=rollEra());
  S.usedE.add(e.id);
  clearInterval(S.spinTimer);
  if(reduce){S.org=o;S.current=e;S.phase='pick';render();return;}
  const randOrg=()=>ORGS[Math.floor(Math.random()*ORGS.length)];
  if(!keepTeam){S.phase='spinTeam';S.org=randOrg();S.current=S.org.eras.at(-1);}
  else S.phase='spinEra';
  render();
  const n=o.eras.length, teamTicks=keepTeam?0:11, eraTicks=n>1?6+n*2:0;
  let t=0;
  S.spinTimer=setInterval(()=>{
    t++;
    if(t<teamTicks){S.org=randOrg();S.current=S.org.eras.at(-1);renderStage();return;}
    if(t>=teamTicks+eraTicks){clearInterval(S.spinTimer);S.org=o;S.current=e;S.phase='pick';render();return;}
    S.org=o;S.phase='spinEra';S.current=o.eras[(t-teamTicks)%n];renderStage();
  },65);
}

function pick(idx){
  const e=S.current,p=e.players[idx];if(!p||!canTake(p))return;const i=openSlotFor(p);
  S.slots[i]={...p,eid:e.id};
  if(picks()===N){
    S.result=simulate(S.slots);S.phase='result';
    if(S.mode==='daily')store.set(saveKey(),S.slots.map(x=>[x.sid,x.n,x.eid]));
    render();
  } else deal(false);
}

  const seasons=e.sids.map(id=>SEASONS[id]);
  const recs=seasons.map(s=>`<span>${s.yr}${s.rec&&s.rec!=='—'?` <b>${s.rec}</b>`:''}${s.champ?' <span class="champ">★</span>':''}</span>`).join('');
  const notes=seasons.filter(s=>s.note).map(s=>`<li><b>${s.yr}</b>${esc(s.note)}</li>`).join('');
  const chip=phase==='spinTeam'?'Rolling team…':phase==='spinEra'?'Rolling era…':(e.lg==='OWCS'?'OWCS':'Overwatch League');
  return `<div class="banner${settled?'':' rolling'}" style="--team:${team};--team-ink:${inkFor(team)}">
      <div class="banner-logo sk">${logo(e.ab,'')}</div>
      <div class="banner-top"><span class="tagchip sk">${chip}</span>${settled&&seasons.some(s=>s.champ)?'<span class="tagchip sk gold">★ Champion era</span>':''}</div>
      <h3 class="banner-title">${phase==='spinTeam'?esc(o.name):`<span class="yr">${e.span}</span>${esc(e.team)}`}</h3>
      <div class="eras" aria-label="Eras for this team">${phase==='spinTeam'?'':chips}</div>
    </div>
    `;
}

function progressHTML(){
  const n=picks();
  return `<div class="progress"><span class="step">Pick <b>${Math.min(n+1,N)}</b> of ${N}</span><div class="pips">${[...Array(N).keys()].map(i=>`<span class="pip ${i<n?'on':''}"></span>`).join('')}</div></div>`;
}

function renderStage(){
  const el=document.getElementById('stage');
  if(S.phase==='intro'){
    const opt=(id,txt,on)=>`<button class="mopt sk${on?' on':''}" id="${id}" type="button" aria-pressed="${on}">${txt}</button>`;
    el.innerHTML=`<div class="menu">
      <button class="play sk" id="go" type="button"><span>${S.replay?'Your result':'Play'}</span><small>${S.mode==='daily'?`Daily #${DAILY_NO}`:'Free play'} · ${FMT}${S.replay?' · already played today':''}</small></button>
      <div class="mrow"><span class="mlabel">Mode</span>${opt('mode-daily','Daily',S.mode==='daily')}${opt('mode-free','Free play',S.mode==='free')}</div>
      <div class="mrow"><span class="mlabel">Format</span>${opt('fmt-5','5v5',FMT==='5v5')}${opt('fmt-6','6v6',FMT==='6v6')}</div>
      <div class="mrow"><span class="mlabel">Ratings</span>${opt('rt-off','Hidden',!showRatings)}${opt('rt-on','Shown',showRatings)}</div>
    </div>`;
    document.getElementById('go').onclick=()=>{if(S.replay){S.phase='result';render();}else deal(false);};
    document.getElementById('mode-daily').onclick=()=>setMode('daily',true);
    document.getElementById('mode-free').onclick=()=>setMode('free',true);
            const setR=v=>{showRatings=v;store.set('40-0/showRatings',v);render();};
    document.getElementById('rt-off').onclick=()=>setR(false);
    document.getElementById('rt-on').onclick=()=>setR(true);
    return;
  }
  if(S.phase==='spinTeam'||S.phase==='spinEra'||S.phase==='pick'){
    const e=S.current;
    let html=progressHTML()+`<div class="${S.phase==='pick'?'pop':''}" style="display:grid;gap:12px">${cardHTML(e,S.org||ORG_BY[e.org],S.phase)}</div>`;
    if(S.phase==='pick'){
      const groups=['T','D','S'].map(ro=>({ro,ps:e.players.map((p,idx)=>({p,idx})).filter(x=>x.p.ro===ro)})).filter(g=>g.ps.length);
      html+=`<div class="roster">`+groups.map(g=>`<section><h4 class="rhead r-${g.ro}">${ICON[g.ro]}<span>${ROLE_NAME[g.ro]}</span></h4><div class="tiles">`+
        g.ps.map(({p,idx})=>{
          const ok=canTake(p), why=taken(p.n)?'already drafted':'slot full';
          return `<button class="tile sk" type="button" data-i="${idx}" ${ok?'':'disabled'} aria-label="Draft ${esc(p.n)}, ${subName(p)}${ok?'':` (${why})`}">
            <span class="t-name">${esc(p.n)}</span><span class="t-sub">${ok?`${subName(p)} · ${yrsText(p.yrs)}`:why}</span>${showRatings?`<span class="t-ovr">${p.ra}</span>`:''}</button>`;
        }).join('')+`</div></section>`).join('')+`</div>`;
      const alts=altEras().length;
      html+=`<div class="actions">
        <button class="btn sk" id="reroll-team" type="button" ${S.rerollTeam?'':'disabled'}>Reroll team · ${S.rerollTeam}</button>
        <button class="btn sk" id="reroll-era" type="button" ${S.rerollEra&&alts?'':'disabled'} title="${alts?'Keep this team, spin another era':'This team has no other era that fits your open slots'}">Reroll era · ${S.rerollEra}</button>
      </div>`;
    }
    el.innerHTML=html;
    el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    const rt=document.getElementById('reroll-team');if(rt)rt.onclick=()=>{if(S.rerollTeam){S.rerollTeam--;deal(false);}};
    const re=document.getElementById('reroll-era');if(re)re.onclick=()=>{if(S.rerollEra&&altEras().length){S.rerollEra--;deal(true);}};
    return;
  }
  if(S.phase==='result')renderResult(el);
}

function renderResult(el){
  const r=S.result;
  const best=bestFromPicks(S.slots);
  const bestRes=best?simulate(best):null;
  const lossesList=r.games.filter(g=>!g.w).sort((a,b)=>b.s.str-a.s.str);
  const bestWins=r.games.filter(g=>g.w).sort((a,b)=>b.s.str-a.s.str).slice(0,3);
  let po='';
  if(r.playoffs){
    po=r.playoffs.map(p=>`<li><span class="k">${p.name} <small>vs</small> ${logo(p.opp.ab,'mini')}${esc(label(p.opp))}</span><span class="v ${p.won?'won':'lost'}">${p.won?'W':'L'} ${p.a}–${p.b}</span></li>`).join('');
    po+=`<li><span class="k"><b>${r.champion?'★ Champions':'Season over'}</b></span><span class="v ${r.champion?'gold-t':'lost'}">${r.champion?'Title':'Out'}</span></li>`;
  } else po=`<li><span class="k">Missed the playoffs (${PLAYOFF_WINS} wins needed)</span><span class="v lost">Out</span></li>`;
  const sameAsBest=best&&best.every((p,i)=>p.n===S.slots[i].n&&p.sid===S.slots[i].sid);
  const tone=r.champion?'gold':r.wins>=PLAYOFF_WINS?'blue':'red';
  el.innerHTML=`
    <div class="post ${tone} pop">
      <div><span class="tagchip sk">${S.replay?'Your saved result for today':`Regular season · ${GAMES} matches`} · ${FMT}</span></div>
      <div class="post-verdict">${verdict(r.wins)}</div>
      <div class="post-rec" aria-label="${r.wins} wins, ${r.losses} losses"><span>${r.wins}</span><span class="d">–</span><span>${r.losses}</span></div>
      <p class="post-sub">Team rating ${r.R.toFixed(1)}: ${r.avg.toFixed(1)} average plus ${r.chem.toFixed(1)} chemistry.</p>
    </div>
    <div class="strip" role="img" aria-label="Match results, ${r.wins} wins and ${r.losses} losses">${r.games.map(g=>`<span class="g ${g.w?'W':'L'}" title="${g.w?'Win':'Loss'} vs ${esc(label(g.s))}"></span>`).join('')}</div>
    <div class="cols">
      <div class="box"><h4>Playoffs</h4><ul class="rows">${po}</ul></div>
      <div class="box"><h4>Best draft from your spins${bestRes?` · ${bestRes.wins}–${bestRes.losses}`:''}</h4>${
        sameAsBest?`<p style="margin:0">You found the best possible ${NUMWORD[N]} from these spins.</p>`:
        `<ul class="rows">${best.map((p,i)=>`<li><span class="k"><span class="r-${p.ro}">${SLOTS[i].label}</span> · ${logo(SEASONS[p.sid].ab,'mini')}${esc(p.n)} <small>${esc(short(SEASONS[p.sid]))}</small></span><span class="v">${p.ra}</span></li>`).join('')}</ul>`
      }</div>
    </div>
    <div class="actions">
      <button class="btn sk primary" id="share" type="button">Copy result</button>
      <button class="btn sk" id="again" type="button">${S.mode==='daily'?'Play free mode':'Draft again'}</button>
      <span id="copymsg" class="copied" hidden>Copied</span>
    </div>
    <textarea id="sharebox" class="share-fallback" hidden readonly aria-label="Result text to copy"></textarea>`;
  document.getElementById('again').onclick=()=>{setMode('free',true);deal(false);};
  document.getElementById('share').onclick=()=>{
    const txt=shareText();
    const ok=()=>{const m=document.getElementById('copymsg');m.hidden=false;};
    const fail=()=>{const b=document.getElementById('sharebox');b.hidden=false;b.value=txt;b.focus();b.select();};
    try{navigator.clipboard.writeText(txt).then(ok,fail);}catch(e){fail();}
  };
}

function shareText(){
  const r=S.result;
  const head=`28–0 · ${FMT} · ${S.mode==='daily'?`Daily #${DAILY_NO}`:'Free play'}`;
  const line=`${r.wins}–${r.losses}${r.champion?' · 🏆 Champions':r.playoffs?' · Playoffs':''}`;
  const grid=[0,1,2,3].map(k=>r.games.slice(k*7,k*7+7).map(g=>g.w?'🟩':'🟥').join('')).join('\n');
  const lu=S.slots.map((p,i)=>`${SLOTS[i].code} ${p.n} (${short(SEASONS[p.sid])})`).join('\n');
  return `${head}\n${line}\n${grid}\n${lu}`;
}

function render(){
  const inMenu=S.phase==='intro';
  document.getElementById('lineup').hidden=inMenu;
  document.getElementById('menu-btn').hidden=inMenu;
  renderLineup();renderStage();
}

function setMode(m,force){if(S&&S.mode===m&&!force)return;if(S)clearInterval(S.spinTimer);newGame(m);render();}

function setFormat(f){
  if(f===FMT)return;
  FMT=f;store.set('40-0/format',f);
  SLOTS=FORMATS[FMT];N=SLOTS.length;SLOT_ROLES=SLOTS.map(s=>s.ro);applyFormatStrength();
  setMode(S.mode,true);
}
document.getElementById('menu-btn').onclick=()=>{clearInterval(S.spinTimer);newGame(S.mode);render();};
newGame('daily');render();
</script>
</body>
</html>
